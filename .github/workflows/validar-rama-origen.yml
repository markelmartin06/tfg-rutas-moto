name: Validar rama de origen

# Comprueba que los PR siguen el flujo de ramas del proyecto:
#   develop -> staging -> main
# A staging solo pueden llegar PR desde develop, y a main solo desde staging.

on:
  pull_request:
    branches: [staging, main]
    types: [opened, reopened, synchronize, edited]

jobs:
  validar-rama-origen:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar rama de origen
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "staging" ] && [ "$HEAD" != "develop" ]; then
            echo "::error::A staging solo se puede hacer PR desde develop (este PR viene de '$HEAD')."
            exit 1
          fi
          if [ "$BASE" = "main" ] && [ "$HEAD" != "staging" ]; then
            echo "::error::A main solo se puede hacer PR desde staging (este PR viene de '$HEAD')."
            exit 1
          fi
          echo "Rama de origen correcta: $HEAD -> $BASE"
